<button
  type="button"
  appButton
  [attr.data-tooltip]="
    'Add recordings from this computer, with their stats .csv files. ' + source.addedFilesGo
  "
  (click)="file.click()"
>
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 16V4M7 9l5-5 5 5M5 20h14"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  Upload
</button>
<input
  #file
  type="file"
  multiple
  hidden
  accept=".mp4,.mkv,.mov,.webm,.csv"
  (change)="pickFiles(file)"
/>
@if (withLink()) {
  <app-link-form />
}
@if (state.busy(); as b) {
  <span class="busy" role="status">
    @if (b.share === null) {
      <span class="spinner" aria-hidden="true"></span>
    } @else {
      <span class="progress-ring" aria-hidden="true" [style.--share]="b.share"></span>
    }
    <span class="note">{{ b.text }}</span>
  </span>
} @else if (state.note(); as n) {
  <span class="status status-line" [attr.role]="n.failed ? 'alert' : 'status'">{{ n.text }}</span>
}
@if (dragging()) {
  <div class="drop-zone" aria-hidden="true">
    <div class="drop-box">
      <span class="drop-title">Drop a recording here</span>
      <span>and its stats .csv, if you have it. {{ source.addedFilesGo }}</span>
    </div>
  </div>
}
