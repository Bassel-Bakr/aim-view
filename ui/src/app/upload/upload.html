<button
  type="button"
  [class]="button"
  [title]="'Add recordings from this computer, with their stats .csv files. ' + source.addedFilesGo"
  (click)="file.click()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true" [class]="ui.icon">
    <path
      d="M12 16V4M7 9l5-5 5 5M5 20h14"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
  Upload
</button>
<input
  #file
  type="file"
  multiple
  hidden
  accept=".mp4,.mkv,.mov,.webm,.csv"
  (change)="pickFiles(file)"
/>
@if (transfer(); as t) {
  <span role="status" [class]="ui.note">{{ t }}</span>
} @else if (note(); as n) {
  <span [class]="n.failed ? ui.failed : ui.note" [attr.role]="n.failed ? 'alert' : 'status'">{{
    n.text
  }}</span>
}
@if (dragging()) {
  <div aria-hidden="true" [class]="ui.dropZone">
    <div [class]="ui.dropBox">
      <span [class]="ui.dropTitle">Drop a recording here</span>
      <span>and its stats .csv, if you have it. {{ source.addedFilesGo }}</span>
    </div>
  </div>
}
