<div class="labels" aria-hidden="true">
  <span class="label"
    >Kills <span>{{ kills() }} measured</span></span
  >
  <span class="label"
    >TTK <span class="long"><i class="swatch"></i>over 1 s</span></span
  >
</div>
<div
  #box
  class="box"
  role="slider"
  tabindex="0"
  aria-label="The kills over the run: click near one to play it, elsewhere to go there"
  aria-valuemin="0"
  aria-valuenow="0"
  [attr.aria-valuemax]="seconds()"
  (keydown)="moveWithKeys($event)"
>
  @let m = lanes();
  <svg class="lanes" aria-hidden="true">
    <rect class="lane-line" x="0" width="100%" [attr.y]="m.split" height="1" />
    @for (k of m.kills; track k.flick.kill_number) {
      <rect
        class="mark"
        [attr.data-tone]="k.picked ? 'picked' : null"
        [attr.x]="k.atPercent + '%'"
        [attr.y]="m.markTop"
        [attr.width]="m.markWidth"
        [attr.height]="m.markHeight"
        [attr.transform]="'translate(' + -m.markWidth / 2 + ' 0)'"
      />
      <rect
        class="bar"
        [attr.data-tone]="k.tone"
        [attr.x]="k.atPercent + '%'"
        [attr.y]="k.barTop"
        [attr.width]="m.barWidth"
        [attr.height]="k.barHeight"
        [attr.transform]="'translate(' + -m.barWidth / 2 + ' 0)'"
      />
    }
  </svg>
  <div #head class="head" hidden aria-hidden="true"></div>
  <div class="tip" #tip hidden aria-hidden="true"></div>
</div>
