@if (table().groups.length) {
  <section [attr.aria-label]="heading()">
    <h3>{{ heading() }}</h3>
    <p class="section-note"><ng-content /></p>
    <app-data-table
      [label]="heading()"
      [rows]="rows()"
      [columns]="columns()"
      [rowId]="rowId"
      [grouping]="grouping"
      [groupings]="groupings"
      cards="medium"
    />
  </section>
}
