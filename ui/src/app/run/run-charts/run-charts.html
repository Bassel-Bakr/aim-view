<div class="cells">
  @let kt = killTimes();
  <figure class="chart">
    <figcaption class="chart-title">Kill times through the run</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Each kill's time, in its five parts, in the order of the run"
      [attr.viewBox]="'0 0 ' + kt.box.width + ' ' + kt.box.height"
    >
      @for (t of kt.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="kt.box.left"
          [attr.x2]="kt.box.width - kt.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="kt.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of kt.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="kt.box.height - 6">
          {{ t.label }}
        </text>
      }
      @for (b of kt.bars; track b.flick.kill_number) {
        <g
          class="bar"
          [attr.data-selected]="b.flick === focus.selected() ? '' : null"
          (click)="focus.play(b.flick)"
        >
          <title>{{ b.title }}</title>
          @for (s of b.segments; track $index) {
            <rect
              [attr.x]="b.x"
              [attr.y]="s.y"
              [attr.width]="b.width"
              [attr.height]="s.height"
              [style.fill]="s.color"
            />
          }
          <rect
            class="mark"
            [attr.x]="b.x - 1"
            [attr.y]="b.top - 1"
            [attr.width]="b.width + 2"
            [attr.height]="kt.box.height - kt.box.bottom - b.top + 2"
          />
        </g>
      }
      @if (kt.median; as m) {
        <line
          class="median"
          [attr.x1]="kt.box.left"
          [attr.x2]="kt.box.width - kt.box.right"
          [attr.y1]="m.at"
          [attr.y2]="m.at"
        />
        <text
          class="median-label"
          text-anchor="end"
          [attr.x]="kt.box.width - kt.box.right"
          [attr.y]="m.at - 4"
        >
          {{ m.label }}
        </text>
      }
    </svg>
    <p class="chart-note">
      Each kill in its five parts, as in the time budget below. Click one to play it.
    </p>
  </figure>

  @let ft = fitts();
  <figure class="chart">
    <figcaption class="chart-title">Distance and kill time</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Each kill's time against its distance, with the time the run's own curve gives for each distance"
      [attr.viewBox]="'0 0 ' + ft.box.width + ' ' + ft.box.height"
    >
      @for (t of ft.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="ft.box.left"
          [attr.x2]="ft.box.width - ft.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="ft.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of ft.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="ft.box.height - 6">
          {{ t.label }}
        </text>
      }
      @for (d of ft.dots; track d.flick.kill_number) {
        <circle
          class="dot"
          [attr.data-selected]="d.flick === focus.selected() ? '' : null"
          [attr.cx]="d.x"
          [attr.cy]="d.y"
          (click)="focus.play(d.flick)"
        >
          <title>{{ d.title }}</title>
        </circle>
      }
      <path class="curve" [attr.d]="ft.curve" />
    </svg>
    <p class="chart-note">
      The line is the time Fitts' law, fitted to this run, gives for each distance: kills above it
      were slow for their distance.
    </p>
  </figure>

  @let cg = clicks();
  <figure class="chart">
    <figcaption class="chart-title">Where the clicks landed</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Where each click landed on its target, every flick turned to come from the left"
      [attr.viewBox]="'0 0 ' + cg.box.width + ' ' + cg.box.height"
    >
      <line
        class="grid"
        [attr.x1]="cg.box.left"
        [attr.x2]="cg.box.width - cg.box.right"
        [attr.y1]="cg.center.y"
        [attr.y2]="cg.center.y"
      />
      <line
        class="grid"
        [attr.x1]="cg.center.x"
        [attr.x2]="cg.center.x"
        [attr.y1]="cg.box.top"
        [attr.y2]="cg.box.height - cg.box.bottom"
      />
      <circle class="target" [attr.cx]="cg.center.x" [attr.cy]="cg.center.y" [attr.r]="cg.radius" />
      <text class="label" text-anchor="start" [attr.x]="cg.box.left" [attr.y]="cg.center.y - 6">
        short
      </text>
      <text
        class="label"
        text-anchor="end"
        [attr.x]="cg.box.width - cg.box.right"
        [attr.y]="cg.center.y - 6"
      >
        past
      </text>
      <text class="label" text-anchor="start" [attr.x]="cg.box.left" [attr.y]="cg.box.height - 6">
        the flick comes from the left · target edge {{ cg.scale.label }}
      </text>
      @for (d of cg.dots; track d.flick.kill_number) {
        <circle
          class="dot"
          [attr.data-missed]="d.missed ? '' : null"
          [attr.data-selected]="d.flick === focus.selected() ? '' : null"
          [attr.cx]="d.x"
          [attr.cy]="d.y"
          (click)="focus.play(d.flick)"
        >
          <title>{{ d.title }}</title>
        </circle>
      }
      @if (cg.average; as a) {
        <path
          class="average"
          [attr.d]="'M' + (a.x - 6) + ',' + a.y + 'h12M' + a.x + ',' + (a.y - 6) + 'v12'"
        />
      }
    </svg>
    <p class="chart-note">
      Each click's place on its target. Yellow: the kill took more than one shot. The cross is the
      clicks' average.
    </p>
  </figure>

  @let sp = speeds();
  <figure class="chart">
    <figcaption class="chart-title">Every flick's speed, °/s</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Every flick's speed, lined up at the end of its main flick, with their median"
      [attr.viewBox]="'0 0 ' + sp.box.width + ' ' + sp.box.height"
    >
      @for (t of sp.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="sp.box.left"
          [attr.x2]="sp.box.width - sp.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="sp.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of sp.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="sp.box.height - 6">
          {{ t.label }}
        </text>
      }
      <line
        class="zero"
        [attr.x1]="sp.zero"
        [attr.x2]="sp.zero"
        [attr.y1]="sp.box.top"
        [attr.y2]="sp.box.height - sp.box.bottom"
      />
      <!-- the curves faster than the scale's top run off the plot, cut at its edge -->
      <clipPath id="run-speeds-plot">
        <rect
          [attr.x]="sp.box.left"
          [attr.y]="sp.box.top"
          [attr.width]="sp.box.width - sp.box.left - sp.box.right"
          [attr.height]="sp.box.height - sp.box.top - sp.box.bottom"
        />
      </clipPath>
      <g clip-path="url(#run-speeds-plot)">
        @for (l of sp.lines; track l.flick.kill_number) {
          <path class="flick-line" [attr.d]="l.path" />
        }
        <path class="median-line" [attr.d]="sp.median" />
        @if (focusedSpeed(); as f) {
          <path class="focused-line" [attr.d]="f.path" />
        }
      </g>
    </svg>
    <p class="chart-note">
      Milliseconds from the end of each main flick. The bold line is the median; the picked kill is
      in yellow.
    </p>
  </figure>

  @let ks = shares();
  <figure class="chart">
    <figcaption class="chart-title">Where each kill's time went</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Each kill's time as shares of its parts, in the order of the run"
      [attr.viewBox]="'0 0 ' + ks.box.width + ' ' + ks.box.height"
    >
      @for (t of ks.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="ks.box.left"
          [attr.x2]="ks.box.width - ks.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="ks.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of ks.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="ks.box.height - 6">
          {{ t.label }}
        </text>
      }
      @for (b of ks.bars; track b.flick.kill_number) {
        <g
          class="bar"
          [attr.data-selected]="b.flick === focus.selected() ? '' : null"
          (click)="focus.play(b.flick)"
        >
          <title>{{ b.title }}</title>
          @for (s of b.segments; track $index) {
            <rect
              [attr.x]="b.x"
              [attr.y]="s.y"
              [attr.width]="b.width"
              [attr.height]="s.height"
              [style.fill]="s.color"
            />
          }
          <rect
            class="mark"
            [attr.x]="b.x - 1"
            [attr.y]="b.top - 1"
            [attr.width]="b.width + 2"
            [attr.height]="ks.box.height - ks.box.bottom - b.top + 2"
          />
        </g>
      }
    </svg>
    <p class="chart-note legend">
      @for (s of ks.legend; track s.label) {
        <span class="legend-item">
          <span class="color-swatch" [style.background]="s.color"></span>
          {{ s.label }} {{ s.share }}
        </span>
      }
    </p>
    <p class="chart-note">
      Each kill's time as shares of its parts, in the order of the run; beside each name, its share
      of the whole run. Click a kill to play it.
    </p>
  </figure>

  @let ld = landing();
  <figure class="chart">
    <figcaption class="chart-title">Where flicks land</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Where each flick's main movement stopped, from the target's center along the flick"
      [attr.viewBox]="'0 0 ' + ld.box.width + ' ' + ld.box.height"
    >
      <rect
        class="target-band"
        [attr.x]="ld.target.from"
        [attr.y]="ld.box.top"
        [attr.width]="ld.target.to - ld.target.from"
        [attr.height]="ld.box.height - ld.box.top - ld.box.bottom"
      />
      @for (t of ld.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="ld.box.left"
          [attr.x2]="ld.box.width - ld.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="ld.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of ld.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="ld.box.height - 6">
          {{ t.label }}
        </text>
      }
      <line
        class="zero"
        [attr.x1]="ld.zero"
        [attr.x2]="ld.zero"
        [attr.y1]="ld.box.top"
        [attr.y2]="ld.box.height - ld.box.bottom"
      />
      @for (c of ld.cells; track c.flick.kill_number) {
        <rect
          class="cell"
          [attr.data-landing]="c.landing"
          [attr.data-selected]="c.flick === focus.selected() ? '' : null"
          [attr.x]="c.x"
          [attr.y]="c.y"
          [attr.width]="c.width"
          [attr.height]="c.height"
          (click)="focus.play(c.flick)"
        >
          <title>{{ c.title }}</title>
        </rect>
      }
      @if (ld.median; as m) {
        <line
          class="median"
          [attr.x1]="m.at"
          [attr.x2]="m.at"
          [attr.y1]="ld.box.top"
          [attr.y2]="ld.box.height - ld.box.bottom"
        />
        <text
          class="median-label"
          text-anchor="start"
          [attr.x]="m.at + 4"
          [attr.y]="ld.box.top + 24"
        >
          {{ m.label }}
        </text>
      }
      <text class="label" text-anchor="start" [attr.x]="ld.box.left + 4" [attr.y]="ld.box.top + 10">
        {{ words.underflick }}
      </text>
      <text
        class="label"
        text-anchor="end"
        [attr.x]="ld.box.width - ld.box.right - 4"
        [attr.y]="ld.box.top + 10"
      >
        {{ words.overflick }}
      </text>
    </svg>
    <p class="chart-note">
      Where each flick's main movement stopped, in degrees from the target's center, every flick
      turned to come from the left. The band is the target: left of it an underflick, right of it an
      overflick. Click a block to play its kill.
    </p>
  </figure>

  @let ftm = flickTime();
  <figure class="chart">
    <figcaption class="chart-title">Flick time and distance</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Each flick's time against its distance, with Fitts' law fitted to the run's flicks"
      [attr.viewBox]="'0 0 ' + ftm.box.width + ' ' + ftm.box.height"
    >
      @for (t of ftm.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="ftm.box.left"
          [attr.x2]="ftm.box.width - ftm.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="ftm.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of ftm.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="ftm.box.height - 6">
          {{ t.label }}
        </text>
      }
      @for (d of ftm.dots; track d.flick.kill_number) {
        <circle
          class="dot"
          [attr.data-selected]="d.flick === focus.selected() ? '' : null"
          [attr.cx]="d.x"
          [attr.cy]="d.y"
          (click)="focus.play(d.flick)"
        >
          <title>{{ d.title }}</title>
        </circle>
      }
      <path class="curve" [attr.d]="ftm.curve" />
    </svg>
    <p class="chart-note">
      Each flick's time in ms against its distance at the start, and the line Fitts' law fitted to
      this run's flicks gives: a dot far above the line is a slow flick for its distance.
    </p>
    @if (ftm.fit; as f) {
      <p class="chart-note">The line: {{ f }}, W the target's width.</p>
    }
  </figure>

  @let dw = wheel();
  <figure class="chart">
    <figcaption class="chart-title">{{ words.flickSpeed }} by direction</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="Flick speed toward each of eight directions, against the run's median for the distance"
      [attr.viewBox]="'0 0 ' + dw.box.width + ' ' + dw.box.height"
    >
      <circle class="target" [attr.cx]="dw.center.x" [attr.cy]="dw.center.y" [attr.r]="dw.outer" />
      @for (w of dw.wedges; track w.name) {
        @if (w.path) {
          <path
            class="wedge"
            [attr.data-mark]="w.mark"
            [attr.data-selected]="$index === selectedSector() ? '' : null"
            [attr.d]="w.path"
          >
            <title>{{ w.title }}</title>
          </path>
        }
        <text class="label" text-anchor="middle" [attr.x]="w.label.x" [attr.y]="w.label.y + 4">
          {{ w.arrow }}
          <title>{{ w.title }}</title>
        </text>
      }
      <circle class="ring" [attr.cx]="dw.center.x" [attr.cy]="dw.center.y" [attr.r]="dw.ring" />
      @if (dw.best; as b) {
        <text class="label" [attr.x]="dw.box.left - 34" [attr.y]="dw.box.top + 12">Best</text>
        <text class="median-label" [attr.x]="dw.box.left - 34" [attr.y]="dw.box.top + 28">
          {{ b.arrow }} {{ b.name }}, {{ b.value }}
        </text>
      }
      @if (dw.weakest; as w) {
        <text class="label" [attr.x]="dw.box.left - 34" [attr.y]="dw.box.top + 52">Weakest</text>
        <text class="median-label" [attr.x]="dw.box.left - 34" [attr.y]="dw.box.top + 68">
          {{ w.arrow }} {{ w.name }}, {{ w.value }}
        </text>
      }
    </svg>
    <p class="chart-note">
      Each direction's median flick speed (the way covered over the flick's time), each flick
      against the median of its distance group, as the what-if line compares directions. The dashed
      ring is the run's median (1×); the best and weakest directions are colored and named on the
      left. A direction needs 3 flicks and 5% of them.
    </p>
  </figure>

  @let pc = pace();
  <figure class="chart">
    <figcaption class="chart-title">Pace through the run</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="The kills in each 10 seconds of the run, with its best 10 seconds"
      [attr.viewBox]="'0 0 ' + pc.box.width + ' ' + pc.box.height"
    >
      @if (pc.best; as b) {
        <rect
          class="best-window"
          [attr.x]="b.x"
          [attr.y]="pc.box.top"
          [attr.width]="b.width"
          [attr.height]="pc.box.height - pc.box.top - pc.box.bottom"
        />
      }
      @for (t of pc.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="pc.box.left"
          [attr.x2]="pc.box.width - pc.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="pc.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of pc.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="pc.box.height - 6">
          {{ t.label }}
        </text>
      }
      @if (pc.average; as a) {
        <line
          class="median"
          [attr.x1]="pc.box.left"
          [attr.x2]="pc.box.width - pc.box.right"
          [attr.y1]="a.at"
          [attr.y2]="a.at"
        />
        <text
          class="median-label"
          text-anchor="end"
          [attr.x]="pc.box.width - pc.box.right"
          [attr.y]="a.at - 4"
        >
          {{ a.label }}
        </text>
      }
      <path class="curve" [attr.d]="pc.line" />
      @if (pc.best; as b) {
        <circle class="peak" [attr.cx]="b.peak.x" [attr.cy]="b.peak.y" />
        <text class="median-label" text-anchor="middle" [attr.x]="b.peak.x" [attr.y]="b.peak.y - 8">
          {{ b.label }}
        </text>
      }
      @for (k of pc.kills; track k.flick.kill_number) {
        <rect
          class="kill-tick"
          [attr.data-selected]="k.flick === focus.selected() ? '' : null"
          [attr.x]="k.x - 1.5"
          [attr.y]="pc.box.height - pc.box.bottom - 8"
          width="3"
          height="8"
          (click)="focus.play(k.flick)"
        >
          <title>Kill {{ k.flick.kill_number }}</title>
        </rect>
      }
    </svg>
    <p class="chart-note">
      The kills in each 10 s of the run, by seconds from its first flick; the shaded stretch is the
      best 10 s, which the what-if line "Keep up your best 10 seconds all run" uses. The dashed line
      is the run's own rate. The ticks along the bottom are the kills: click one to play it.
    </p>
  </figure>
</div>
