<div class="flex flex-wrap items-start justify-between gap-x-7 gap-y-4">
  <app-run-header class="min-w-0 flex-1" [recording]="recording()" [report]="report()" />
  <div class="flex items-center gap-3 rounded-lg border border-border bg-surface-1 p-2">
    <button
      type="button"
      class="btn"
      [class.btn-primary]="!recording().analysed"
      [disabled]="review.running()"
      (click)="startReview()"
    >
      {{ actionLabel() }}
    </button>
  </div>
</div>
@if (reviewedBy(); as note) {
  <p class="mt-2 text-xs text-muted">{{ note }}</p>
}
@if (progress(); as p) {
  <div class="mt-4 flex items-center gap-5 text-xs text-secondary">
    <progress class="w-(--progress-width) accent-accent" max="1" [value]="p.fraction"></progress>
    <span [attr.role]="p.failed ? 'alert' : 'status'">{{ p.stage }}</span>
    <span aria-hidden="true">{{ p.count }}</span>
  </div>
}
<app-player class="mt-6" [src]="videoUrl()" [report]="report()" [tracks]="tracks()">
  @if (trackReport(); as tr) {
    @if (tracks(); as t) {
      <app-timeline [report]="tr" [tracks]="t" />
    }
  }
</app-player>
