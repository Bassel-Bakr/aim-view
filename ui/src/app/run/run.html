<div [class]="ui.head">
  <app-run-header [class]="ui.header" [recording]="recording()" [report]="report()" />
  <div [class]="ui.toolbar">
    <button
      type="button"
      [class]="recording().analysed ? button : primaryButton"
      [disabled]="review.running()"
      (click)="startReview()"
    >
      {{ actionLabel() }}
    </button>
  </div>
</div>
@if (reviewedBy(); as note) {
  <p [class]="ui.note">{{ note }}</p>
}
@if (progress(); as p) {
  <div [class]="ui.progress">
    <progress max="1" [class]="ui.bar" [value]="p.fraction"></progress>
    <span [attr.role]="p.failed ? 'alert' : 'status'">{{ p.stage }}</span>
    <span aria-hidden="true">{{ p.count }}</span>
  </div>
}
<!-- The player keeps its place whatever the report, so the video never reloads when the report arrives -->
<div class="stage">
  <app-player [src]="videoUrl()" [report]="report()" [tracks]="tracks()">
    @if (trackReport(); as tr) {
      @if (tracks(); as t) {
        <app-timeline [report]="tr" [tracks]="t" />
      }
    }
  </app-player>
  @if (clickReport(); as cr) {
    <app-flick-list [report]="cr" />
  }
</div>
@if (clickReport(); as cr) {
  <app-speed-chart [report]="cr" />
  <app-click-report [class]="ui.report" [report]="cr" />
} @else if (trackReport(); as tr) {
  <app-track-report [class]="ui.report" [report]="tr" />
}
