<div class="charts">
  @let ot = onTarget();
  <figure class="chart">
    <figcaption class="chart-title">On target, {{ window }} seconds at a time</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="The share of the time on the bot in each stretch of the run"
      [attr.viewBox]="'0 0 ' + ot.box.width + ' ' + ot.box.height"
    >
      @for (t of ot.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="ot.box.left"
          [attr.x2]="ot.box.width - ot.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="ot.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of ot.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="ot.box.height - 6">
          {{ t.label }}
        </text>
      }
      @for (b of ot.bars; track b.seconds) {
        <rect
          class="bar"
          [attr.x]="b.x"
          [attr.y]="b.y"
          [attr.width]="b.width"
          [attr.height]="b.height"
          (click)="goTo(b.seconds)"
        >
          <title>{{ b.title }}</title>
        </rect>
      }
      @if (ot.overall; as o) {
        <line
          class="median"
          [attr.x1]="ot.box.left"
          [attr.x2]="ot.box.width - ot.box.right"
          [attr.y1]="o.at"
          [attr.y2]="o.at"
        />
        <text
          class="median-label"
          text-anchor="end"
          [attr.x]="ot.box.width - ot.box.right"
          [attr.y]="o.at - 4"
        >
          {{ o.label }}
        </text>
      }
    </svg>
    <p class="chart-note">
      The share of each stretch spent on the bot, of the time tracking. Click one to go there in the
      video.
    </p>
  </figure>

  @let sp = spread();
  <figure class="chart">
    <figcaption class="chart-title">Distance from the bot's center line</figcaption>
    <svg
      class="chart-svg"
      role="img"
      aria-label="How the distance from the bot's center line was spread over the run"
      [attr.viewBox]="'0 0 ' + sp.box.width + ' ' + sp.box.height"
    >
      @for (t of sp.yTicks; track t.label) {
        <line
          class="grid"
          [attr.x1]="sp.box.left"
          [attr.x2]="sp.box.width - sp.box.right"
          [attr.y1]="t.at"
          [attr.y2]="t.at"
        />
        <text class="label" text-anchor="end" [attr.x]="sp.box.left - 6" [attr.y]="t.at + 4">
          {{ t.label }}
        </text>
      }
      @for (t of sp.xTicks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="sp.box.height - 6">
          {{ t.label }}
        </text>
      }
      @for (b of sp.bars; track $index) {
        <rect
          class="band"
          [attr.x]="b.x"
          [attr.y]="b.y"
          [attr.width]="b.width"
          [attr.height]="b.height"
        >
          <title>{{ b.title }}</title>
        </rect>
      }
      @if (sp.edge; as e) {
        <line
          class="edge"
          [attr.x1]="e.at"
          [attr.x2]="e.at"
          [attr.y1]="sp.box.top"
          [attr.y2]="sp.box.height - sp.box.bottom"
        />
        <text
          class="median-label"
          text-anchor="start"
          [attr.x]="e.at + 4"
          [attr.y]="sp.box.top + 10"
        >
          {{ e.label }}
        </text>
      }
      @if (sp.median; as m) {
        <line
          class="median"
          [attr.x1]="m.at"
          [attr.x2]="m.at"
          [attr.y1]="sp.box.top"
          [attr.y2]="sp.box.height - sp.box.bottom"
        />
        <text
          class="median-label"
          text-anchor="start"
          [attr.x]="m.at + 4"
          [attr.y]="sp.box.top + 24"
        >
          {{ m.label }}
        </text>
      }
    </svg>
    <p class="chart-note">
      The share of the time at each distance, on or near the bot (within three of its radii). Left
      of its edge, the crosshair was on it.
    </p>
  </figure>

  @let am = around();
  <figure class="chart">
    <figcaption class="chart-title">Where you sat around the moving bot</figcaption>
    @if (am.reason) {
      <p class="chart-note">{{ am.reason }}</p>
    } @else {
      <svg
        class="chart-svg"
        role="img"
        aria-label="Where the crosshair sat around the bot while it moved, the bot moving to the right"
        [attr.viewBox]="'0 0 ' + am.box.width + ' ' + am.box.height"
      >
        <line
          class="grid"
          [attr.x1]="am.box.left"
          [attr.x2]="am.box.width - am.box.right"
          [attr.y1]="am.center.y"
          [attr.y2]="am.center.y"
        />
        <line
          class="grid"
          [attr.x1]="am.center.x"
          [attr.x2]="am.center.x"
          [attr.y1]="am.box.top"
          [attr.y2]="am.box.height - am.box.bottom"
        />
        @for (c of am.cells; track $index) {
          <rect
            class="cell"
            [attr.x]="c.x"
            [attr.y]="c.y"
            [attr.width]="c.size"
            [attr.height]="c.size"
            [attr.fill-opacity]="c.shade"
          >
            <title>{{ c.title }}</title>
          </rect>
        }
        <circle
          class="edge-ring"
          [attr.cx]="am.center.x"
          [attr.cy]="am.center.y"
          [attr.r]="am.radius"
        />
        @if (am.usual; as u) {
          <path
            class="usual"
            [attr.d]="'M' + (u.x - 6) + ',' + u.y + 'h12M' + u.x + ',' + (u.y - 6) + 'v12'"
          />
        }
        <text class="label" text-anchor="start" [attr.x]="am.box.left" [attr.y]="am.center.y - 6">
          behind
        </text>
        <text
          class="label"
          text-anchor="end"
          [attr.x]="am.box.width - am.box.right"
          [attr.y]="am.center.y - 6"
        >
          ahead
        </text>
        @for (t of am.xTicks; track t.label) {
          <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="am.box.height - 6">
            {{ t.label }}
          </text>
        }
      </svg>
      <p class="chart-note">
        Every moment the bot moved and you were with it, turned so it moves to the right. The
        darker, the more time there. The circle is its usual edge; the cross, your usual place along
        its motion.
      </p>
    }
  </figure>

  @let tb = turns();
  <figure class="chart">
    <figcaption class="chart-title">Back on the bot after its turns</figcaption>
    @if (tb.reason) {
      <p class="chart-note">{{ tb.reason }}</p>
    } @else {
      <svg
        class="chart-svg"
        role="img"
        aria-label="How long you took to get back on the bot after each of its direction changes"
        [attr.viewBox]="'0 0 ' + tb.box.width + ' ' + tb.box.height"
      >
        @for (t of tb.yTicks; track t.label) {
          <line
            class="grid"
            [attr.x1]="tb.box.left"
            [attr.x2]="tb.box.width - tb.box.right"
            [attr.y1]="t.at"
            [attr.y2]="t.at"
          />
          <text class="label" text-anchor="end" [attr.x]="tb.box.left - 6" [attr.y]="t.at + 4">
            {{ t.label }}
          </text>
        }
        @for (t of tb.xTicks; track t.label) {
          <text class="label" text-anchor="middle" [attr.x]="t.at" [attr.y]="tb.box.height - 6">
            {{ t.label }}
          </text>
        }
        @if (tb.median; as m) {
          <line
            class="median"
            [attr.x1]="tb.box.left"
            [attr.x2]="tb.box.width - tb.box.right"
            [attr.y1]="m.at"
            [attr.y2]="m.at"
          />
          <text
            class="median-label"
            text-anchor="end"
            [attr.x]="tb.box.width - tb.box.right"
            [attr.y]="m.at - 4"
          >
            {{ m.label }}
          </text>
        }
        @for (d of tb.dots; track d.seconds) {
          <circle
            class="dot"
            [attr.data-lost]="d.lost ? '' : null"
            [attr.cx]="d.x"
            [attr.cy]="d.y"
            (click)="goTo(d.seconds)"
          >
            <title>{{ d.title }}</title>
          </circle>
        }
      </svg>
      <p class="chart-note">
        {{ tb.note }} Each dot is a turn of the bot; the ringed ones at the top, turns you were not
        back from before the next. Click one to go there in the video.
      </p>
    }
  </figure>
</div>
