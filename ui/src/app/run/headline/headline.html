@for (t of tiles(); track t.label) {
  <div
    class="tile"
    [attr.data-attention]="t.attention ? '' : null"
    [attr.data-good]="t.good ? '' : null"
    [attr.data-tooltip]="t.why"
  >
    <span class="tile-label" [attr.data-tooltip]="t.label">{{ t.label }}</span>
    <span class="tile-value" [attr.data-tooltip]="t.value">{{ t.value }}</span>
    <span class="tile-note" [attr.data-tooltip]="t.note">{{ t.note }}</span>
  </div>
}
