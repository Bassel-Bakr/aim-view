<div class="screen" [class]="ui.screen" [style.aspect-ratio]="aspect()">
  <video
    #video
    preload="metadata"
    muted
    playsinline
    [class]="ui.video"
    [src]="src()"
    (click)="playback.toggle()"
    (play)="playback.paused.set(false)"
    (pause)="playback.paused.set(true)"
    (loadedmetadata)="loadedMetadata()"
    (seeked)="showSeekedFrame()"
  ></video>
  <canvas #overlay aria-hidden="true" [class]="ui.canvas"></canvas>
  <span #clock class="time" aria-hidden="true" [class]="ui.time"></span>
</div>

<ng-content />

<div [class]="ui.seekRow">
  <div aria-hidden="true" [class]="ui.marks">
    @for (m of marks(); track $index) {
      <i class="mark" [style.left.%]="m"></i>
    }
  </div>
  <input
    #seek
    type="range"
    min="0"
    step="any"
    aria-label="Position in the video"
    [class]="ui.seek"
    [max]="playback.duration()"
    (pointerdown)="startSeeking()"
    (pointerup)="stopSeeking()"
    (input)="seekTo(seek.valueAsNumber)"
  />
</div>

<div [class]="ui.controls">
  <button
    type="button"
    [class]="button"
    [attr.aria-label]="playback.paused() ? 'Play' : 'Pause'"
    (click)="playback.toggle()"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" [class]="ui.icon">
      @if (playback.paused()) {
        <path d="M8 5v14l11-7z" />
      } @else {
        <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
      }
    </svg>
  </button>
  <div role="group" aria-label="Playback speed" [class]="speed.group">
    @for (r of rates; track r) {
      <button
        type="button"
        [class]="speed.option"
        [attr.aria-pressed]="playback.rate() === r"
        (click)="playback.setRate(r)"
      >
        {{ rateLabels[r] }}
      </button>
    }
  </div>
  <button
    type="button"
    role="switch"
    [class]="toggle.root"
    [attr.aria-checked]="showOverlay()"
    (click)="toggleOverlay()"
  >
    <span aria-hidden="true" [class]="toggle.knob"></span>
    Show the tracked target
  </button>
  <span [class]="ui.hint">Space plays · ← → one frame · Shift ← → the next kill</span>
</div>
