<div class="screen" [style.aspect-ratio]="aspect()">
  <video
    class="video"
    #video
    preload="metadata"
    muted
    playsinline
    [src]="src()"
    (click)="playback.toggle()"
    (play)="playback.paused.set(false)"
    (pause)="playback.paused.set(true)"
    (loadedmetadata)="loadedMetadata()"
    (seeked)="showSeekedFrame()"
  ></video>
  <canvas class="canvas" #overlay aria-hidden="true"></canvas>
</div>

<ng-content />

<div class="seek-row">
  <span #clock class="time" aria-hidden="true">0:00.0</span>
  <div class="seek-wrap">
    <div class="marks" aria-hidden="true">
      @for (m of marks(); track $index) {
        <i class="mark" [style.left.%]="m"></i>
      }
    </div>
    <input
      class="seek"
      #seek
      type="range"
      min="0"
      step="any"
      aria-label="Position in the video"
      [max]="playback.duration()"
      (pointerdown)="startSeeking()"
      (pointerup)="stopSeeking()"
      (input)="seekTo(seek.valueAsNumber)"
    />
  </div>
  <span class="time" aria-hidden="true">{{ end() }}</span>
</div>

<div class="controls">
  <span class="speed">Speed</span>
  <div class="rates" role="group" aria-label="Playback speed">
    @for (r of rates; track r) {
      <button
        class="rate"
        type="button"
        [attr.aria-pressed]="playback.rate() === r"
        (click)="playback.setRate(r)"
      >
        {{ rateLabels[r] }}
      </button>
    }
  </div>
  <label class="check">
    <input type="checkbox" [checked]="showOverlay()" (change)="toggleOverlay()" />
    Show the tracked target
  </label>
  @if (clicking()) {
    <label class="check">
      <input
        type="checkbox"
        [checked]="focus.follow()"
        (change)="focus.setFollow(!focus.follow())"
      />
      Follow the video in the list
    </label>
    <label class="check">
      <input type="checkbox" [checked]="showFastest()" (change)="toggleFastest()" />
      Show the fastest path
    </label>
    <label class="check">
      <input type="checkbox" [checked]="showMine()" (change)="toggleMine()" />
      Show my path
    </label>
  }
  <span class="hint">Space plays · ← → one frame · Shift ← → the next kill</span>
</div>
