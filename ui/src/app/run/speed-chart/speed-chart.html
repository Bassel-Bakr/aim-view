<div class="chart-head">
  Crosshair speed in the selected flick, °/s
  <label class="smooth">
    <input type="checkbox" [checked]="smooth()" (change)="toggleSmooth()" />
    Smooth
  </label>
  <span class="chart-label">{{ title() }}</span>
</div>
<div class="frame">
  @let m = model();
  <svg
    class="svg"
    #svg
    role="slider"
    tabindex="0"
    aria-valuemin="0"
    aria-valuenow="0"
    [attr.aria-label]="'Crosshair speed over the flick. ' + title()"
    [attr.aria-valuemax]="flickMs()"
    [attr.viewBox]="m ? '0 0 ' + m.size.width + ' ' + m.size.height : null"
    (click)="goToPoint($event)"
    (keydown)="stepWithKeys($event)"
  >
    @if (m) {
      @for (g of m.grid; track g.label) {
        <line
          class="grid"
          [attr.x1]="m.left"
          [attr.x2]="m.size.width - m.right"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
        />
        <text class="label" text-anchor="end" [attr.x]="m.left - 6" [attr.y]="g.y + 4">
          {{ g.label }}
        </text>
      }
      @for (t of m.ticks; track t.label) {
        <text class="label" text-anchor="middle" [attr.x]="t.x" [attr.y]="m.size.height - 6">
          {{ t.label }}
        </text>
      }
      <line
        class="axis"
        [attr.x1]="m.left"
        [attr.x2]="m.size.width - m.right"
        [attr.y1]="m.bottom"
        [attr.y2]="m.bottom"
      />
      @for (k of m.moments; track k.label) {
        <line
          class="moment"
          [attr.x1]="k.x"
          [attr.x2]="k.x"
          [attr.y1]="m.top"
          [attr.y2]="m.bottom"
        />
        <text class="moment-label" [attr.x]="k.x + 3" [attr.y]="m.top + 10">{{ k.label }}</text>
      }
      <path class="speed" [attr.d]="m.line" />
      <line #head class="head" [attr.y1]="m.top" [attr.y2]="m.bottom" />
      <circle #marker class="marker" visibility="hidden" />
    }
  </svg>
  <div class="tip" #tip hidden aria-hidden="true"></div>
</div>
