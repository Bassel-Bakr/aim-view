<button
  type="button"
  appButton
  title="A queue: go through recordings one by one, set the faint-target cut-off in each, Submit and next. The detector learns from them. For one recording, open it and use Cut-off"
  [disabled]="queue.loading()"
  (click)="startQueue()"
>
  Cut-off queue
</button>
@if (queue.note(); as n) {
  <span class="note status-line" [attr.role]="n.failed ? 'alert' : 'status'">{{ n.text }}</span>
}
