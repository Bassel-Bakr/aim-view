[package]
name = "aimview"
version = "0.1.0"
edition = "2024"
description = "Aim View's review core: finds the targets in a recording and measures the aim"
publish = false

[workspace]
# desktop/: the Tauri app. The detector prototype keeps its own build until its code moves into src/.
members = ["desktop"]
exclude = ["python/model/rust"]

[lib]
# rlib: the desktop app links it; cdylib: the WebAssembly module the browser loads (src/wasm.rs)
crate-type = ["rlib", "cdylib"]

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# `bun run app` builds the desktop app unoptimized; the review core and every crate the app uses are optimized there
# too, so a review runs at full speed (av1: 347 s unoptimized) while the app's own code still rebuilds quickly
[profile.dev.package.aimview]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# `cargo test --profile quick`: optimized like release (the parity tests need fast code), without the whole-program
# optimization that makes each release build slow. The same arithmetic, so the same results.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# a test build still checks every integer for overflow (the release build wraps silently)
overflow-checks = true
debug-assertions = true
