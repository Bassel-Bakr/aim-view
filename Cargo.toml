[package]
name = "aimview"
version = "0.1.0"
edition = "2024"
description = "Aim View's review core: finds the targets in a recording and measures the aim"
publish = false

[workspace]
# desktop/: the Tauri app; service/: the review server's API and the native review, which the desktop app and the HTTP
# server (server/) serve, and its aimview-tool gives the Python scripts; browser-service/: the same service as
# WebAssembly, which browser mode runs in a worker. The detector prototype keeps its own build until its code moves
# into src/.
members = ["browser-service", "desktop", "service", "server"]
exclude = ["python/model/rust", "prototypes/gpu_decode"]

[workspace.lints.rust]
# AGENTS.md, "Readable code": every public item has a doc comment
missing_docs = "warn"

[workspace.lints.clippy]
# AGENTS.md, "Readable code": warnings, which the refactor clears file by file; new code adds none (limits: clippy.toml)
min_ident_chars = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
# every private item too: functions, methods, types, traits, fields, enum variants, constants and modules
missing_docs_in_private_items = "warn"

[lints]
workspace = true

[lib]
# rlib: the desktop app links it; cdylib: the WebAssembly module the browser loads (src/wasm.rs)
crate-type = ["rlib", "cdylib"]
# `cargo bench` runs only the criterion benches: the lib's own test harness would refuse their options
bench = false

[features]
# `bun run types`: the TypeScript types of the JSON the UI reads, made from these structs (ts-rs). Off in every build.
ts = ["dep:ts-rs"]

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }

[dev-dependencies]
# `cargo bench`: the hot paths' benches (benches/hot_paths/; BENCH.md, "Function benchmarks")
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon"] }

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# `bun run app` builds the desktop app unoptimized; the review core and every crate the app uses are optimized there
# too, so a review runs at full speed (av1: 347 s unoptimized) while the app's own code still rebuilds quickly
[profile.dev.package.aimview]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# `bun run assets`: the core as WebAssembly for development, optimized like release without the whole-program
# optimization (a rebuild in about 9 s, not 55). `bun run build` and `--release` build it as release, the build to time.
[profile.wasm-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# `cargo flamegraph --profile profiling` and the heap profile (service's `dhat-heap` feature): release with its
# symbols, so a profile names each function (HOT_PATHS.md)
[profile.profiling]
inherits = "release"
debug = true

# `cargo test --profile quick`: optimized like release (the parity tests need fast code), without the whole-program
# optimization that makes each release build slow. The same arithmetic, so the same results.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# a test build still checks every integer for overflow (the release build wraps silently)
overflow-checks = true
debug-assertions = true
