[package]
name = "aimview"
version = "0.1.0"
edition = "2024"
description = "aimview's review core: finds the targets in a recording and measures the aim"
publish = false

[workspace]
# The detector prototype keeps its own build until its code moves into src/.
exclude = ["python/model/rust"]

[lib]
# rlib: the desktop app links it; cdylib: the WebAssembly module the browser loads (src/wasm.rs)
crate-type = ["rlib", "cdylib"]

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
