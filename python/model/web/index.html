<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Detector in the browser</title>
  <style>
    body { font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: #121211; color: #fff; margin: 20px; }
    table { border-collapse: collapse; margin: 12px 0; }
    th, td { padding: 4px 12px 4px 0; text-align: right; border-bottom: 1px solid #2c2c2a; }

<body>

  <script type="module" src="bench.mjs"></script>

</html>
