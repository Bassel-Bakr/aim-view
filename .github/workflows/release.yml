# Releases the app the three ways it ships, versioned by its commits. On a push to main that changes the app (not the
# training scripts or the docs), and from Actions > Release > Run workflow: scripts/next-version.ts works out the next
# semver from the Conventional Commits since the last vX.Y.Z tag (breaking: major, the minor before 1.0; feat: minor;
# fix and perf: patch; the other types release nothing), the version is written into the manifests for the build
# only (scripts/stamp-version.ts), and the three builds become one GitHub release tagged vX.Y.Z:
#  - aim-view-browser-<version>.zip: browser mode, a static site (ui/dist/browser/browser) with the models, no data
#  - aim-view-server-<version>.zip: aimview-server for Windows (DirectML), its server-mode UI, the models, the VC++
#    runtime, aimview-server.toml (its paths start at its folder) and start-server.cmd
#  - aim-view-desktop-<version>-setup.exe: the desktop app's installer (Tauri, NSIS)
# A newer push cancels a run still going, so a burst of commits makes one release.
name: Release

on:
  push:
    branches: [main]
    paths:
      - src/**
      - service/**
      - server/**
      - desktop/**
      - browser-service/**
      - ui/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - package.json
      - bun.lock
      - scripts/ui-*.ts
      - scripts/next-version.ts
      - scripts/stamp-version.ts
      - python/model/models.json
      - python/model/exports/*_u8in.onnx
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (off builds only)
        type: boolean
        default: true
      force:
        description: Release a patch even when no commit calls for one
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - id: next
        run: |
          version=$(bun scripts/next-version.ts ${{ inputs.force && '--force' || '' }})
          echo "next version: ${version:-none (no feat, fix or perf commit since the last release)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  browser:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun scripts/stamp-version.ts ${{ needs.version.outputs.version }}
      - run: bun run build:browser
      - name: Package
        run: |
          cd ui/dist/browser/browser
          zip -qr "$GITHUB_WORKSPACE/aim-view-browser-${{ needs.version.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: aim-view-browser-*.zip
          if-no-files-found: error

  # the server and the installer in one job, so the native Rust they share (the service, ONNX Runtime) compiles once
  windows:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun scripts/stamp-version.ts ${{ needs.version.outputs.version }}
      - run: bun run build:server
      - run: cargo build --release -p aimview-server
      - name: Package
        shell: pwsh
        run: |
          $dir = 'aim-view-server-${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory $dir, "$dir\ui", "$dir\models" | Out-Null
          Copy-Item target\release\aimview-server.exe $dir
          Copy-Item target\release\DirectML.dll $dir
          Copy-Item ui\dist\server\browser\* "$dir\ui" -Recurse
          Copy-Item ui\generated\models\* "$dir\models" -Recurse
          # the VC++ runtime ONNX Runtime loads, from Visual Studio's redistributable (as desktop/build.rs takes it)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) $dir
          }
          # the settings file the server reads from its own folder: its paths start there (the defaults are the
          # repo's, on the machine that built it); the user adds the recordings' folder and, for the network, a token
          Set-Content "$dir\aimview-server.toml" -Encoding ascii -Value @(
            '# Aim View''s review server: aimview-server --help lists every setting. Open http://127.0.0.1:8770/.',
            "ui = 'ui'",
            "models = 'models'",
            "data = 'data'",
            '# the recordings (one folder per scenario), and for other devices on the network a host and a token:',
            "# vods = 'E:\OBS\KovOBS'",
            "# host = '0.0.0.0'",
            "# token = 'a-long-random-string'"
          )
          Set-Content "$dir\start-server.cmd" '@cd /d "%~dp0" && aimview-server.exe %*' -Encoding ascii
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: aim-view-server-*.zip
          if-no-files-found: error
      # Tauri's CLI runs the desktop build first (tauri.conf.json: bun run build:desktop; the assets above are reused),
      # then bundles the installer
      - run: bunx @tauri-apps/cli@^2 build
        working-directory: desktop
      # named as the other two are (Tauri names it after the product: "Aim View_<version>_x64-setup.exe")
      - name: Name the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Copy-Item $installer.FullName 'aim-view-desktop-${{ needs.version.outputs.version }}-setup.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: aim-view-desktop-*-setup.exe
          if-no-files-found: error

  release:
    needs: [version, browser, windows]
    if: needs.version.outputs.version != '' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/next-version.ts --notes > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Aim View $VERSION" --notes-file notes.md
