# Python's checks (`python -m ruff check python`; AGENTS.md, "Readable code"). Ruff has no check for short names:
# that rule is kept by review.
# old_review.py: the old review's parts, frozen verbatim (scripts/extract_module.py), not refactored
extend-exclude = ["python/retired", "python/model/old_review.py"]

[lint]
# Errors (E4, E7, E9, F), plus: ambiguous and capital variable names (E741, N806), complexity (C901), long
# functions (PLR0915), numbers that need a named constant (PLR2004), and a docstring for every module, class, method and
# function (D100 to D107)
select = ["E4", "E7", "E9", "F", "E741", "N806", "C901", "PLR0915", "PLR2004", "D100", "D101", "D102", "D103", "D104",
          "D105", "D106", "D107"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-statements = 40
