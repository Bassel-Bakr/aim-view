[package]
name = "aimview-desktop"
version = "0.1.0"
edition = "2024"
description = "Aim View's desktop app (Tauri 2): the Angular app in a window, with the review core built natively"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aimview = { path = ".." }
# ONNX Runtime, with DirectML for any Windows GPU (its prebuilt library is downloaded at build time)
ort = { version = "=2.0.0-rc.10", features = ["directml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the system's folder dialog (the VODs folder)
rfd = "0.15"
# ffmpeg downloaded into the app's folder on first need, as KovOBS gets it (not shipped with the app)
ffmpeg-sidecar = "2.5.2"
anyhow = "1"
# NumPy's .npz files (zips of arrays), as python/ writes and reads them
zip = { version = "4.6", default-features = false, features = ["deflate"] }
