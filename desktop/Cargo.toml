[package]
name = "aimview-desktop"
version = "0.1.0"
edition = "2024"
description = "Aim View's desktop app (Tauri 2): the Angular app in a window, with the review core built natively"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
aimview = { path = ".." }
# the review server's API and the native review (the library in the app's data folder)
aimview-service = { path = "../service" }
serde_json = "1"
# the system's folder dialog (the VODs folder), shown on the window's main thread as GTK needs on Linux
tauri-plugin-dialog = "2"
# the user's app data folders, where the app's own folders go (lib.rs)
dirs = "7"

[lints]
workspace = true
