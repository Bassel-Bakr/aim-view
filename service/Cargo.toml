[package]
name = "aimview-service"
version = "0.1.0"
edition = "2024"
description = "Aim View's review service: the review server's API (python/server.py) over a library of recordings, with the review run natively. The desktop app and the HTTP server both serve it."
publish = false

# the library and the native review from the command line, for the Python scripts (python/aimview_tools.py)
[[bin]]
name = "aimview-tool"
path = "src/bin/aimview-tool.rs"
required-features = ["native"]

[[example]]
name = "track"
required-features = ["native"]

[[example]]
name = "mouse_read"
required-features = ["native"]

[features]
default = ["native"]
# what needs this computer: ONNX Runtime, ffmpeg and yt-dlp (processes and threads), and the time zone. Without it the
# service is built for the browser (browser-service/): its files go through the page (disk.rs), the page runs the
# review and the area finder, and links are the page's to download.
native = ["dep:ort", "dep:ffmpeg-sidecar", "dep:libc", "dep:windows"]
# the detector on an NVIDIA GPU (Linux), through ONNX Runtime's CUDA build
cuda = ["native", "ort/cuda"]
# `bun run types`: the TypeScript types of the JSON the UI reads, made from these structs and the core's (ts-rs)
ts = ["dep:ts-rs", "aimview/ts"]

[dependencies]
aimview = { path = ".." }
# ONNX Runtime: on the CPU everywhere, DirectML on Windows (any GPU), CUDA with the `cuda` feature
ort = { version = "=2.0.0-rc.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
# the API's paths and queries, read as the desktop app's window sends them
url = "2"
# ffmpeg downloaded on first need, as KovOBS gets it (Config.ffmpeg: Ffmpeg::Download)
ffmpeg-sidecar = { version = "2.5.2", optional = true }
anyhow = "1"
# NumPy's .npz files (zips of arrays), as python/ writes and reads them
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# its prebuilt library is downloaded at build time
ort = { version = "=2.0.0-rc.10", features = ["directml"], optional = true }
# frames decoded and converted on the GPU (gpu_frames.rs): Media Foundation, Direct3D 11 and its shader compiler
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(unix)'.dependencies]
# the local time zone's offset at a given time (localtime_r), for local time stamps off Windows
libc = { version = "0.2", optional = true }

[lints]
workspace = true
