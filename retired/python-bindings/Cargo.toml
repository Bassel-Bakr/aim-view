[package]
name = "aimview-py"
version = "0.1.0"
edition = "2024"
description = "Aim View's Python module (aimview): the review service's library and API, and the core's review, for python/server.py and the training and evaluation scripts"
publish = false

[lib]
# the Python module is called aimview (pyproject.toml); the review core's crate has that name already
name = "aimview_py"
crate-type = ["cdylib"]
# no Rust tests: python/server.py and the scripts check the module
test = false
doctest = false

[dependencies]
aimview = { path = ".." }
aimview-service = { path = "../service" }
# abi3: one build for Python 3.10 and every later version (3.14 here). generate-import-lib: the workspace builds
# without a Python's libs folder.
pyo3 = { version = "0.29", features = ["abi3-py310", "generate-import-lib"] }
serde_json = "1"
